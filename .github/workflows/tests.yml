name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boulder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Firebase service account file
        run: |
          mkdir -p config
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 --decode > config/serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}

      - name: Create .env.test file
        run: |
          cat > .env.test << EOF
          PORT=3333
          HOST=localhost
          LOG_LEVEL=info
          APP_KEY=$(openssl rand -base64 32)
          NODE_ENV=test

          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=boulder_test

          SESSION_DRIVER=cookie
          BREVO_API_KEY=fake_key_for_tests
          GOOGLE_CLIENT_ID=fake_google_id
          GOOGLE_CLIENT_SECRET=fake_google_secret
          GOOGLE_CALLBACK_URL=http://localhost:3333/auth/google/callback
          EOF

      - name: Run migrations
        run: node ace migration:run --force
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: boulder_test

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: boulder_test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            .coverage/
