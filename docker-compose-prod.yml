version: '3.8'

services:
  postgres-prod:
    container_name: postgres-prod
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${DB_USER_ADMIN}
      POSTGRES_PASSWORD: ${DB_PASSWORD_ADMIN}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    volumes:
      - postgres_volume:/var/lib/postgresql/data
      - ./dockerConfig/init.sh:/docker-entrypoint-initdb.d/init.sh # will setup dev database adonis_app for us
    ports:
      - ${DB_PORT}:${DB_PORT}

  adonis_app-prod:
    container_name: adonis_app-prod
    restart: always
    depends_on:
      - postgres-prod
    build:
      context: .
      target: dependencies
    ports:
      - ${PORT}:${PORT}
      - 9230:9230
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
    volumes:
      - ./:/home/node/app
    command: ash -c "node ace migration:run && dumb-init npm install --force node ace build --ignore-ts-errors dotenv -e .env node build/server.js"

volumes:
  postgres_volume:
