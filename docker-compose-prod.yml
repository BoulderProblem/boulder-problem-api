version: '3.8'

services:
  postgres-prod:
    container_name: postgres-prod
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${DB_USER_ADMIN}
      POSTGRES_PASSWORD: ${DB_PASSWORD_ADMIN}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    volumes:
      - postgres_volume:/var/lib/postgresql/data
      - ./dockerConfig/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - ${DB_PORT}:${DB_PORT}

  adonis_app-prod:
    container_name: adonis_app-prod
    restart: always
    depends_on:
      - postgres-prod
    build:
      context: .
      target: production
    ports:
      - ${PORT}:${PORT}
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-prod  # <-- Important !
    command: >
      dumb-init sh -c "node build/ace migration:run && node build/server.js"

volumes:
  postgres_volume:
