version: '3.8'

services:
  postgres:
    container_name: postgres
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${DB_USER_ADMIN}
      POSTGRES_PASSWORD: ${DB_PASSWORD_ADMIN}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    volumes:
      - postgres_volume:/var/lib/postgresql/data
      - ./dockerConfig/init.sh:/docker-entrypoint-initdb.d/init.sh # will setup dev database adonis_app for us
    ports:
      - ${DB_PORT}:${DB_PORT}

  adonis_app:
    container_name: adonis_app
    restart: always
    depends_on:
      - postgres
    build:
      context: .
      target: build
    ports:
      - ${PORT}:${PORT}
      - 9229:9229
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    volumes:
      - ./:/home/node/app
      - /home/node/app/node_modules
    command: sh -c "node ace migration:run && dumb-init node ace serve --watch"

volumes:
  postgres_volume:
